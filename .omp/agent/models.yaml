providers:
  openai-codex:
    baseUrl: https://chatgpt.com/backend-api
    api: openai-codex-responses
    auth: oauth
    models:
      # Keep Codex resolution exact; otherwise an absent catalog entry fuzzily
      # selects an older Sol release before retry fallbacks can run.
      - id: gpt-6-sol
        name: GPT-6 Sol
        reasoning: true
        input: [text, image]
        supportsTools: true
        contextWindow: 125000
        maxTokens: 128000
        preferWebsockets: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
  openrouter:
    modelOverrides:
      google/gemini-3.5-flash:
        compat:
          openRouterRouting:
            only: [google-ai-studio]
      z-ai/glm-5.2:
        compat:
          openRouterRouting:
            only: [novita/fp8]
      moonshotai/kimi-k2.7-code:
        compat:
          openRouterRouting:
            only: [together]
  github-copilot:
    modelOverrides:
      claude-opus-5.5:
        contextWindow: 125000
      gpt-6-sol:
        contextWindow: 125000
      # Copilot ships kimi-k3 only at its full 1M window; cap it at 250K.
      kimi-k3:
        contextWindow: 250000
