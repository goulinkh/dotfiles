providers:
  openrouter:
    modelOverrides:
      google/gemini-3.5-flash:
        compat:
          openRouterRouting:
            only: [google-ai-studio]
      z-ai/glm-5.2:
        compat:
          openRouterRouting:
            only: [novita/fp8]
      moonshotai/kimi-k2.7-code:
        compat:
          openRouterRouting:
            only: [together]
  github-copilot:
    modelOverrides:
      # Copilot ships kimi-k3 only at its full 1M window; cap it at 250K.
      kimi-k3:
        contextWindow: 250000
