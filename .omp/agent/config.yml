setupVersion: 2
enabledModels:
  - anthropic/claude-opus-5-5
  - openai-codex/gpt-6.1-sol
modelRoles:
  smol: github-copilot/claude-sonnet-5:xhigh
  opus: anthropic/claude-opus-5-5:high
  sol: openai-codex/gpt-6.1-sol:xhigh
  plan: openai-codex/gpt-6.1-sol:xhigh
  default: anthropic/claude-opus-5-5
cycleOrder:
  - default
  - sol
hideThinkingBlock: true
textVerbosity: low
ttsr:
  judge: "on"
codexResets:
  autoRedeem: "no"
dev:
  autoqaConsent: denied
composer:
  shape: pi
startup:
  quiet: true
retry:
  fallbackChains:
    github-copilot/gpt-6.1-sol:
      - openai-codex/gpt-6-sol
tier:
  openai: priority
  anthropic: priority
  google: priority
display:
  collapseCompacted: false
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - status
    - usage
    - session_name
    - token_total
    - cost
    - context_pct
  showHookStatus: false