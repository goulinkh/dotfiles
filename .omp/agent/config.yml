setupVersion: 2
modelRoles:
  default: github-copilot/gpt-6-sol:max
  #default: openai-codex/gpt-6-sol:max
  smol: github-copilot/claude-sonnet-5:high
  opus: github-copilot/claude-opus-5:high
  astra: openai-codex/gpt-6-astra:high
  plan: github-copilot/kimi-k3:high
  kimi: github-copilot/kimi-k3:high
cycleOrder:
  - default
  - opus
  - astra
hideThinkingBlock: false
textVerbosity: low
codexResets:
  autoRedeem: "yes"
dev:
  autoqaConsent: denied
composer:
  shape: pi
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    - usage
    - session_name
startup:
  quiet: true
retry:
  fallbackChains:
    openai-codex/gpt-6-sol:
      - github-copilot/gpt-6-sol
