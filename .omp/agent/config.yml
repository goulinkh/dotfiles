setupVersion: 2
modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: github-copilot/claude-sonnet-5:high
  opus: github-copilot/claude-opus-5:high
  plan: github-copilot/kimi-k3:high
  kimi: github-copilot/kimi-k3:high
cycleOrder:
  - default
  - opus
  - kimi
hideThinkingBlock: true
textVerbosity: low
extensions:
  - ~/.omp/swarm-extension/src/extension.ts
codexResets:
  autoRedeem: "yes"
dev:
  autoqaConsent: denied
composer:
  shape: pi
retry:
  fallbackChains:
    openai-codex/gpt-5.6-sol:
      - github-copilot/gpt-5.6-sol
