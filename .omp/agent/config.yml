setupVersion: 2
enabledModels:
  - github-copilot/claude-opus-5.5
  - github-copilot/gemini-4-argon
  - openai-codex/gpt-6-astra
modelRoles:
  default: github-copilot/claude-opus-5.5:xhigh
  smol: github-copilot/claude-sonnet-5:xhigh
  opus: github-copilot/claude-opus-5.5:xhigh
  gemini: github-copilot/gemini-4-argon:xhigh
  astra: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:high
cycleOrder:
  - default
  - gemini
  - astra
hideThinkingBlock: true
textVerbosity: low
ttsr:
  judge: "on"
codexResets:
  autoRedeem: "no"
dev:
  autoqaConsent: denied
composer:
  shape: pi
startup:
  quiet: true
retry:
  fallbackChains:
    github-copilot/gpt-6.1-sol:
      - openai-codex/gpt-6-sol
tier:
  openai: priority
  anthropic: priority
  google: priority
display:
  collapseCompacted: false
statusLine:
  preset: custom
  leftSegments: [vim, model, mode, path, git, pr]
  rightSegments: [status, usage, session_name, token_total, cost, context_pct]
  showHookStatus: false
